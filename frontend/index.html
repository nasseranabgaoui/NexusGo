<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusGo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="auth-view" class="view">
        <div class="login-wrapper">
            <h1 class="brand-title">NexusGo.</h1>
            <div class="card login-card">
                <h2>Bienvenue</h2>
                <form id="loginForm">
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email" required>
                    </div>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Mot de passe" required>
                    </div>
                    <button type="submit" class="btn-primary full-width">Se connecter</button>
                    <p id="loginError" class="error-msg"></p>
                </form>
            </div>
        </div>
    </section>

    <section id="app-view" class="view hidden">
        
        <nav>
            <div class="logo">NexusGo.</div>
            <div class="user-menu">
                <span id="userDisplay"><i class="fa-solid fa-user"></i> Invité</span>
                <button onclick="logout()" class="btn-outline">Déconnexion</button>
            </div>
        </nav>

        <div class="hero-container">
            
            <div class="hero-card">
                
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('search')">
                        <i class="fa-solid fa-magnifying-glass"></i> Rechercher
                    </button>
                    <button class="tab-btn" onclick="switchTab('propose')">
                        <i class="fa-solid fa-circle-plus"></i> Proposer
                    </button>
                </div>

                <form id="searchForm" class="tab-content">
                    <div class="input-with-icon">
                        <i class="fa-regular fa-circle"></i>
                        <input type="text" id="searchDepart" placeholder="Gare ou ville de départ">
                    </div>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" id="searchArrivee" placeholder="Gare ou ville d'arrivée">
                    </div>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-calendar"></i>
                        <input type="date" id="searchDate">
                    </div>
                    <button type="submit" class="btn-yellow full-width">Rechercher</button>
                </form>

                <form id="proposeForm" class="tab-content hidden">
                    <div class="input-with-icon">
                        <i class="fa-regular fa-circle"></i>
                        <input type="text" id="proposeDepart" placeholder="Ville de départ" required>
                    </div>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" id="proposeArrivee" placeholder="Ville d'arrivée" required>
                    </div>
                    <div class="row">
                        <div class="input-with-icon">
                            <i class="fa-regular fa-calendar"></i>
                            <input type="date" id="proposeDate" required>
                        </div>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-euro-sign"></i>
                            <input type="number" id="proposePrix" placeholder="Prix" required>
                        </div>
                    </div>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-users"></i>
                        <input type="number" id="proposePlaces" placeholder="Nombre de places" required>
                    </div>
                    <button type="submit" class="btn-yellow full-width">Publier le trajet</button>
                </form>

            </div>

            <div class="hero-text">
                <h1>Réservez et comparez tous les covoiturages</h1>
                <div class="ratings">
                    ⭐⭐⭐⭐⭐ <span>+1 000 000 étudiants</span>
                </div>

                <div class="partners-section">
                    <p>Nos partenaires :</p>
                    <div class="logos-grid">
                        
                        <img src="https://upload.wikimedia.org/wikipedia/fr/3/33/Logo_universit%C3%A9_montpellier.png" 
                             alt="Université Montpellier" class="partner-logo">

                        <img src="https://sciences.edu.umontpellier.fr/wp-content/uploads/2022/06/Nouveau-Logo-FDS-V-Couleur-300x127.png" 
                             alt="Faculté des Sciences" class="partner-logo">

                        <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/0/05/Logo_SNCF_2011.svg/512px-Logo_SNCF_2011.svg.png" 
                             alt="SNCF" class="partner-logo">

                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Logo_TGV_inOui_2017.png/640px-Logo_TGV_inOui_2017.png" 
                             alt="TGV Inoui" class="partner-logo">

                        <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/8/82/BlaBlaCar_logo.svg/1200px-BlaBlaCar_logo.svg.png" 
                             alt="BlaBlaCar" class="partner-logo">

                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/FlixBus_logo.svg/1200px-FlixBus_logo.svg.png" 
                             alt="FlixBus" class="partner-logo">
                    </div>
                </div>
            </div>

        </div>

        <div id="resultsArea" class="results-container"></div>

    </section>

    <script>
        function switchTab(tabName) {
            document.getElementById('searchForm').classList.add('hidden');
            document.getElementById('proposeForm').classList.add('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if(tabName === 'search') {
                document.getElementById('searchForm').classList.remove('hidden');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('proposeForm').classList.remove('hidden');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }
    </script>
    
    <script src="script.js"></script>
</body>
</html>
